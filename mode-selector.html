<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modo de Operación - Tienda CVS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #50c0e0 0%, #90c050 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .selector-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .selector-card img {
      max-width: 100px;
      max-height: 100px;
      margin-bottom: 15px;
    }
    .selector-card h1 {
      font-size: 1.4em;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .selector-card p {
      color: #64748b;
      font-size: 0.9em;
      margin-bottom: 25px;
    }
    .mode-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.primary {
      background: linear-gradient(135deg, #50c0e0 0%, #90c050 100%);
      color: white;
    }
    .mode-btn.secondary {
      background: #f1f5f9;
      color: #1e293b;
      border: 2px solid #e2e8f0;
    }
    .mode-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .status-text {
      margin-top: 15px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.9em;
      color: #334155;
      display: none;
    }
    .status-text.visible {
      display: block;
    }
    .status-text.error {
      background: #fef2f2;
      color: #991b1b;
    }
    .status-text.success {
      background: #f0fdf4;
      color: #166534;
    }
    .manual-fallback {
      margin-top: 15px;
      display: none;
    }
    .manual-fallback.visible {
      display: block;
    }
    .manual-fallback input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1em;
      margin-bottom: 8px;
    }
    .manual-fallback button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #50c0e0 0%, #90c050 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="selector-card">
    <img src="./assets/logo-vida-sana.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Tienda CVS</h1>
    <p>Selecciona el modo de operación</p>
    <button class="mode-btn primary" onclick="selectServerMode()">
      🖥️ Servidor Base
    </button>
    <button class="mode-btn secondary" onclick="autoConnectTailscale()">
      📱 Conectar a Servidor
    </button>

    <div id="status-text" class="status-text"></div>

    <div id="manual-fallback" class="manual-fallback">
      <input type="text" id="manual-ip" placeholder="Ingresa la IP del servidor (Ej: 100.91.160.121)" value="100.91.160.121">
      <button onclick="connectManual()">Conectar</button>
    </div>

    <script>
      const { ipcRenderer } = require('electron');
      const TAILSCALE_SERVER_URL = 'http://100.91.160.121:3000';

      function selectServerMode() {
        localStorage.setItem('server_mode', 'server');
        localStorage.setItem('server_ip', 'localhost');

        if (window.electronAPI && window.electronAPI.startServerMode) {
          window.electronAPI.startServerMode();
        } else if (typeof ipcRenderer !== 'undefined') {
          ipcRenderer.send('select-mode', 'base');
        } else {
          window.location.href = 'index.html';
        }
      }

      function autoConnectTailscale() {
        const serverUrl = TAILSCALE_SERVER_URL;
        localStorage.setItem('serverUrl', serverUrl);
        localStorage.setItem('server_mode', 'client');
        
        showStatus('🔗 Conectando al Servidor Principal vía Tailscale...', '');
        
        const cleanIp = formatServerUrl(serverUrl);
        ipcRenderer.send('connect-to-server', cleanIp);
      }

      function showStatus(message, type = '') {
        const el = document.getElementById('status-text');
        el.textContent = message;
        el.className = 'status-text visible ' + type;
      }

      function hideStatus() {
        const el = document.getElementById('status-text');
        el.className = 'status-text';
        el.textContent = '';
      }

      function hideManualFallback() {
        document.getElementById('manual-fallback').classList.remove('visible');
      }

      function connectToServer(ip) {
        const cleanIp = formatServerUrl(ip);
        localStorage.setItem('server_ip', cleanIp);
        localStorage.setItem('server_mode', 'client');
        ipcRenderer.send('connect-to-server', cleanIp);
      }

      function formatServerUrl(inputIp) {
        let cleanIp = inputIp.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        cleanIp = cleanIp.split(':')[0].trim();
        return cleanIp;
      }

      function connectManual() {
        const rawIp = document.getElementById('manual-ip').value.trim();
        const cleanIp = formatServerUrl(rawIp);
        if (!cleanIp) {
          alert('Ingresa la IP del servidor');
          return;
        }
        const serverUrl = `http://${cleanIp}:3000`;
        localStorage.setItem('serverUrl', serverUrl);
        localStorage.setItem('server_mode', 'client');
        connectToServer(cleanIp);
      }

      function showManualFallback() {
        const manualInput = document.getElementById('manual-ip');
        if (manualInput && !manualInput.value.trim()) {
          manualInput.value = '100.100.50.25'; // Tailscale default
        }
        document.getElementById('manual-fallback').classList.add('visible');
      }
    </script>
</body>
</html>
