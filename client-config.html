<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectar a Servidor - Tienda CVS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #50c0e0 0%, #90c050 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .config-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .config-card img {
      max-width: 80px;
      max-height: 80px;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .config-card h1 {
      font-size: 1.3em;
      color: #1e293b;
      margin-bottom: 6px;
      text-align: center;
    }
    .config-card p {
      color: #64748b;
      font-size: 0.85em;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      font-size: 0.9em;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1em;
    }
    .form-group input:focus {
      outline: none;
      border-color: #50c0e0;
    }
    .connect-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #50c0e0 0%, #90c050 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .connect-btn:hover {
      opacity: 0.9;
    }
    .back-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #64748b;
      border: none;
      font-size: 0.9em;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="config-card">
    <img src="assets/Logo vida sana-02.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Modo Cliente</h1>
    <p>Ingresa la IP del servidor base</p>
    <div class="form-group">
      <label for="server-ip">IP del Servidor</label>
      <input type="text" id="server-ip" placeholder="Ej: 192.168.1.10" value="192.168.1.">
    </div>
    <button class="connect-btn" onclick="connect()">Conectar</button>
    <button class="back-btn" onclick="goBack()">← Volver</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function connect() {
      const ip = document.getElementById('server-ip').value.trim();
      if (!ip) {
        alert('Ingresa la IP del servidor');
        return;
      }
      ipcRenderer.send('connect-to-server', ip);
    }

    function goBack() {
      window.location.reload();
    }
  </script>
</body>
</html>
